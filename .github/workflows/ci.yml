name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The browser runs the model too, so `docs/app/predict.js` is a third implementation of
      # the pipeline. Node is here to run it against the same golden fixture the Python side
      # is held to — those tests skip locally on a machine without it, and this is where the
      # skip is paid off. No package.json: the runtime is a plain script on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[site] pytest httpx ruff
      # Ruff earned its place: one run found five `zip()` calls that would truncate in silence,
      # one of them dropping makes off the end of the vocabulary the runtime refuses without.
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest
      # The published page must be a function of the committed aggregates, and the valuation
      # form's bounds a function of config.py. Rebuilding both here and demanding no diff is
      # what makes that a fact rather than an intention: a page edited by hand, one built from
      # aggregates that were never committed, or a form still validating against last month's
      # vocabulary fails here instead of going live saying something the model does not.
      - name: The published page still matches its inputs
        run: |
          python -m car_price_ml.site.build
          git diff --exit-code -- docs/index.html docs/app/styles.css docs/app/config.json
