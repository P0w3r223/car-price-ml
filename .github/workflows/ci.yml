name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[site] pytest httpx
      - name: Run tests
        run: pytest
      # The published page must be a function of the committed aggregates. Rebuilding it here
      # and demanding no diff is what makes that a fact rather than an intention: a page
      # edited by hand, or one built from aggregates that were never committed, fails here
      # instead of going live saying something the model does not.
      - name: The published page still matches its inputs
        run: |
          python -m car_price_ml.site.build
          git diff --exit-code -- docs/index.html
