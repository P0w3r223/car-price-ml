[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-price-ml"
version = "0.2.0"
description = "Used-car price prediction for the Polish market — EDA, model comparison, FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    # 1.9 is the floor because TargetEncoder only accepts a cross-validation splitter
    # (and therefore a seed) for `cv` from that version; see features.build_preprocessor.
    "scikit-learn>=1.9,<2",
    "lightgbm>=4.3,<5",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "shap>=0.46,<0.50",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
# Building the published page. Kept out of the runtime dependencies because the serving
# container has no use for a template engine, and out of `dev` because CI needs it without
# pulling in JupyterLab.
site = [
    "jinja2>=3.1,<4",
]
dev = [
    "car-price-ml[site]",
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "jupyterlab>=4.2,<5",
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The template and stylesheet are part of the package, not loose files beside it: the page
# build resolves them relative to its own module, which has to keep working when the package
# is installed rather than run from the checkout.
"car_price_ml.site" = ["templates/*.j2", "assets/*.css"]

# Ruff is here because it found a class of defect reading did not: five `zip()` calls that
# would truncate in silence, one of them dropping makes off the end of the served vocabulary.
# `B905` (zip without `strict=`) is the rule that pays for the whole file.
[tool.ruff]
line-length = 100
target-version = "py311"
# The notebook is an exploratory record of what was run, kept for the reasoning rather than
# as maintained code; linting it would only invite edits that make its output a fiction.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM", "RET", "ARG"]
ignore = [
    # The project's own line-length is enforced by E501; formatting is not otherwise policed,
    # because the code is laid out for reading rather than for a formatter.
    "SIM108",  # a ternary is not always clearer than the if/else it replaces
]

[tool.ruff.lint.per-file-ignores]
# Fixtures, parametrised cases and monkeypatch stand-ins take arguments they do not read.
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# The lifespan handler's `app` is FastAPI's signature, not ours to drop.
"api/main.py" = ["ARG001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so tests can import the top-level `api` package.
pythonpath = ["."]
filterwarnings = [
    # FastAPI TestClient / starlette-httpx deprecation — third-party, cosmetic.
    "ignore:Using `httpx` with `starlette.testclient`",
]
