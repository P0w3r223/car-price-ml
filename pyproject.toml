[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car-price-ml"
version = "0.2.0"
description = "Used-car price prediction for the Polish market — EDA, model comparison, FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    # 1.9 is the floor because TargetEncoder only accepts a cross-validation splitter
    # (and therefore a seed) for `cv` from that version; see features.build_preprocessor.
    "scikit-learn>=1.9,<2",
    "lightgbm>=4.3,<5",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<0.14",
    "shap>=0.46,<0.50",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
# Building the published page. Kept out of the runtime dependencies because the serving
# container has no use for a template engine, and out of `dev` because CI needs it without
# pulling in JupyterLab.
site = [
    "jinja2>=3.1,<4",
]
dev = [
    "car-price-ml[site]",
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "jupyterlab>=4.2,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The template and stylesheet are part of the package, not loose files beside it: the page
# build resolves them relative to its own module, which has to keep working when the package
# is installed rather than run from the checkout.
"car_price_ml.site" = ["templates/*.j2", "assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so tests can import the top-level `api` package.
pythonpath = ["."]
filterwarnings = [
    # FastAPI TestClient / starlette-httpx deprecation — third-party, cosmetic.
    "ignore:Using `httpx` with `starlette.testclient`",
]
